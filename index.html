<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rekod Servis</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #eef1f2;
      color: #16252e;
      margin: 0;
      padding: 16px;
    }
    .bekas { max-width: 700px; margin: 0 auto; }
    h1 { margin-top: 0; }
    .kotak {
      background: white;
      border: 1px solid #d3dbdf;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 16px;
    }
    label {
      display: block;
      margin-bottom: 12px;
      font-size: 14px;
      color: #5d6f78;
    }
    input {
      display: block;
      width: 100%;
      padding: 9px 10px;
      margin-top: 4px;
      font-size: 16px;
      border: 1px solid #d3dbdf;
      border-radius: 6px;
      box-sizing: border-box;
    }
    button {
      background: #0b6e79;
      color: white;
      border: 0;
      border-radius: 6px;
      padding: 10px 18px;
      font-size: 16px;
      cursor: pointer;
    }
    button.padam {
      background: #b3261e;
      padding: 5px 10px;
      font-size: 14px;
    }
    .jadual { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td {
      text-align: left;
      padding: 9px 8px;
      border-bottom: 1px solid #d3dbdf;
    }
    th { color: #5d6f78; font-size: 14px; }
    .jumlah { font-size: 18px; margin: 12px 0 0; }
    .butang-bawah { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }

    .ringkasan { border-left: 6px solid #2e7d4f; }
    .ringkasan.hampir { border-left-color: #b45f06; }
    .ringkasan.lewat { border-left-color: #b3261e; }
    .ringkasan p { margin: 4px 0; }
    .besar { font-size: 22px; font-weight: bold; }

    #kotakQr { text-align: center; }
    #qr { display: inline-block; padding: 12px; background: white; }

    @media print {
      form, button, .ringkasan, #kotakQr { display: none; }
      body { background: white; }
      .kotak { border: 0; }
    }
  </style>
</head>
<body>
  <div class="bekas">
    <h1>Rekod Servis Kenderaan</h1>

    <div class="kotak ringkasan" id="ringkasan">
      <p class="besar" id="tajukRingkasan"></p>
      <p id="butirRingkasan"></p>
    </div>

    <div class="kotak">
      <form id="borang">
        <label>Tarikh
          <input id="date" type="date" required>
        </label>
        <label>Odometer (km)
          <input id="odo" type="number" required>
        </label>
        <label>Jenis servis
          <input id="type" placeholder="cth. Tukar minyak enjin" required>
        </label>
        <label>Kos (RM)
          <input id="cost" type="number" step="0.01" required>
        </label>
        <label>Servis seterusnya pada (km), tidak wajib
          <input id="nextKm" type="number" placeholder="cth. 15000">
        </label>
        <button type="submit">Simpan</button>
      </form>
    </div>

    <div class="kotak">
      <h2 style="margin-top:0">Sejarah servis</h2>
      <div class="jadual">
        <table>
          <thead>
            <tr><th>Tarikh</th><th>Odometer</th><th>Servis</th><th>Kos</th><th></th></tr>
          </thead>
          <tbody id="senarai"></tbody>
        </table>
      </div>
      <p class="jumlah">Jumlah kos: <b id="jumlah">RM 0.00</b></p>
      <div class="butang-bawah">
        <button id="hantar" type="button">Hantar ke telefon (QR)</button>
        <button id="eksport" type="button">Muat turun CSV</button>
        <button id="cetak" type="button">Cetak / Simpan PDF</button>
      </div>
    </div>

    <div class="kotak" id="kotakQr" hidden>
      <h2 style="margin-top:0">Imbas dengan kamera telefon</h2>
      <div id="qr"></div>
      <p id="infoQr"></p>
    </div>
  </div>

  <script>
    let rekod = JSON.parse(localStorage.getItem("rekod")) || [];

    function simpan() {
      localStorage.setItem("rekod", JSON.stringify(rekod));
    }

    function nombor(n) {
      return Number(n).toLocaleString("ms-MY");
    }

    function kemaskiniRingkasan() {
      const kotak = document.getElementById("ringkasan");
      const tajuk = document.getElementById("tajukRingkasan");
      const butir = document.getElementById("butirRingkasan");
      kotak.className = "kotak ringkasan";

      if (rekod.length === 0) {
        tajuk.textContent = "Belum ada rekod";
        butir.textContent = "Isi borang di bawah untuk rekod servis pertama.";
        return;
      }

      let odoTerkini = 0;
      let nextKm = null;
      let tarikhNext = "";

      rekod.forEach(function (r) {
        if (r.odo > odoTerkini) odoTerkini = r.odo;
        if (r.nextKm && r.date >= tarikhNext) {
          nextKm = r.nextKm;
          tarikhNext = r.date;
        }
      });

      if (nextKm === null) {
        tajuk.textContent = "Odometer terkini: " + nombor(odoTerkini) + " km";
        butir.textContent = "Servis seterusnya belum ditetapkan.";
        return;
      }

      const baki = nextKm - odoTerkini;
      if (baki < 0) {
        kotak.className = "kotak ringkasan lewat";
        tajuk.textContent = "Servis lewat " + nombor(-baki) + " km";
      } else {
        if (baki <= 1000) kotak.className = "kotak ringkasan hampir";
        tajuk.textContent = "Baki " + nombor(baki) + " km ke servis seterusnya";
      }
      butir.textContent = "Odometer terkini " + nombor(odoTerkini) +
        " km, servis seterusnya pada " + nombor(nextKm) + " km.";
    }

    function papar() {
      const tbody = document.getElementById("senarai");
      tbody.innerHTML = "";
      let jumlah = 0;

      rekod.forEach(function (r, i) {
        tbody.innerHTML += "<tr><td>" + r.date + "</td><td>" + r.odo +
          " km</td><td>" + r.type + "</td><td>RM " + r.cost.toFixed(2) +
          "</td><td><button class='padam' onclick='padam(" + i + ")'>Padam</button></td></tr>";
        jumlah += r.cost;
      });

      document.getElementById("jumlah").textContent = "RM " + jumlah.toFixed(2);
      kemaskiniRingkasan();
    }

    function padam(i) {
      if (confirm("Padam rekod ini?")) {
        rekod.splice(i, 1);
        simpan();
        papar();
      }
    }

    document.getElementById("borang").addEventListener("submit", function (e) {
      e.preventDefault();

      const next = document.getElementById("nextKm").value;

      rekod.push({
        date: document.getElementById("date").value,
        odo: Number(document.getElementById("odo").value),
        type: document.getElementById("type").value,
        cost: Number(document.getElementById("cost").value),
        nextKm: next ? Number(next) : null
      });

      simpan();
      papar();
      e.target.reset();
    });

    document.getElementById("eksport").addEventListener("click", function () {
      let csv = "Tarikh,Odometer,Servis,Kos\n";
      rekod.forEach(function (r) {
        csv += r.date + "," + r.odo + ',"' + r.type.replace(/"/g, '""') + '",' + r.cost + "\n";
      });
      const blob = new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "rekod-servis.csv";
      a.click();
    });

    document.getElementById("cetak").addEventListener("click", function () {
      window.print();
    });

    // ===== BARU: hantar rekod ke telefon melalui QR =====
    document.getElementById("hantar").addEventListener("click", function () {
      const kotakQr = document.getElementById("kotakQr");
      const qr = document.getElementById("qr");
      const info = document.getElementById("infoQr");

      if (rekod.length === 0) {
        alert("Belum ada rekod untuk dihantar.");
        return;
      }

      // Ringkaskan data: setiap rekod jadi satu senarai pendek
      const padat = rekod.map(function (r) {
        return [r.date, r.odo, r.type, r.cost, r.nextKm];
      });
      const b64 = btoa(unescape(encodeURIComponent(JSON.stringify(padat))));
      const url = location.origin + location.pathname + "#data=" + encodeURIComponent(b64);

      if (url.length > 1800) {
        alert("Rekod terlalu banyak untuk satu QR (" + rekod.length +
          " rekod). Padam rekod yang sudah lama, atau guna Muat turun CSV.");
        return;
      }

      qr.innerHTML = "";
      new QRCode(qr, { text: url, width: 280, height: 280, correctLevel: QRCode.CorrectLevel.L });
      info.textContent = rekod.length + " rekod dimasukkan dalam QR ini. Imbas dengan kamera telefon.";
      kotakQr.hidden = false;
      kotakQr.scrollIntoView({ behavior: "smooth" });
    });

    // ===== BARU: terima rekod bila QR diimbas =====
    function terimaDariQr() {
      if (location.hash.indexOf("#data=") !== 0) return;

      try {
        const b64 = decodeURIComponent(location.hash.slice(6));
        const json = decodeURIComponent(escape(atob(b64)));
        const padat = JSON.parse(json);
        let baru = 0;

        padat.forEach(function (p) {
          const ada = rekod.some(function (r) {
            return r.date === p[0] && r.odo === p[1] && r.type === p[2] && r.cost === p[3];
          });
          if (!ada) {
            rekod.push({ date: p[0], odo: p[1], type: p[2], cost: p[3], nextKm: p[4] });
            baru++;
          }
        });

        if (baru > 0) {
          simpan();
          alert(baru + " rekod berjaya dimasukkan.");
        } else {
          alert("Semua rekod ini sudah ada.");
        }
      } catch (err) {
        alert("QR ini tidak sah atau rosak.");
      }

      history.replaceState(null, "", location.pathname);
    }

    terimaDariQr();
    papar();
  </script>
</body>
</html>
